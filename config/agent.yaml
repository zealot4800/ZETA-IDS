provider: mock
model:
  model_env: OPENROUTER_MODEL
  api_mode: decisions
  base_url_env: OPENROUTER_BASE_URL
  decisions_url_env: OPENROUTER_DECISIONS_URL
  family_model_env: OPENROUTER_FAMILY_MODEL
  api_key_env: OPENROUTER_API_KEY
instructions:
  system_prompt: Classify one network flow from numeric evidence only. The flow may
    be benign or malicious. Never assume unresolved means malicious. Return verdict,
    evidence_refs, and rationale in the required structure. Abstain when evidence
    is insufficient. Cite only reference_id values actually provided in the prompt
    or tool results.
  task_prompt: Return a supported verdict or abstain.
generation:
  temperature: 0
  max_output_tokens: 32
  request_timeout_seconds: 30
investigation:
  max_reasoning_steps: 3
  max_tools_per_flow: 5
  max_investigations_per_window: 100000
  max_rationale_chars: 1000
  input_framing_bytes: 256
decisions:
  min_verdict_probability: 0.95
  tool_instructions: Choose the most useful source-only evidence tool for this network flow, or finalize when the available evidence is sufficient.
  finalize_description: Stop retrieving evidence and decide whether the flow is malicious, benign, or unresolved.
  verdict_instructions: Based only on the current flow and retrieved source-training evidence, which intrusion verdict is supported?
  verdict_criteria:
    MALICIOUS: Numeric flow evidence and source-training references support an intrusion decision.
    BENIGN: Numeric flow evidence and source-training references support a benign decision.
    ABSTAIN: Evidence is insufficient, ambiguous, inconsistent, or the flow should remain unresolved.
attack_family:
  max_output_tokens: 128
  max_reference_families: 2
  system_prompt: Select a possible attack family using only the current flow and source-training evidence. Return UNKNOWN if the evidence cannot distinguish families. Do not treat model predictions or source counts as ground truth.
  task_prompt: Return one source attack family or UNKNOWN, with evidence_refs from the supplied reference IDs.
tools:
  enabled:
  - inspect_flow
  - inspect_attack_evidence
  - retrieve_source_reference
  - analyze_benign_region
  - check_feature_consistency
  descriptions:
    inspect_flow: Inspect the current flow's numeric features and frozen classifier
      evidence.
    inspect_attack_evidence: Inspect source-training attack support in the flow's
      decision cell.
    retrieve_source_reference: Retrieve an aggregate source-training family feature
      reference.
    analyze_benign_region: Inspect source-training benign and attack support for the
      flow's region.
    check_feature_consistency: Check numeric and physical consistency of the current
      flow features.
  max_attack_families: 5
  consistency_tolerance: 0.0001
  mock_first_tool: inspect_attack_evidence
budgets:
  max_requests: 100000
  max_tokens: 5000000
  max_tool_calls: 100000
  max_cost_usd: 2.5
  max_seconds: 7200
  max_input_tokens_reserve: 8192
  max_cost_per_request_usd: 0.05
verdict:
  schema_name: zeta_intrusion_verdict
  allowed:
  - MALICIOUS
  - BENIGN
  - ABSTAIN
  required_fields:
  - verdict
  - evidence_refs
  - rationale
  require_evidence_for_decision: true
environment:
  file: .env
  request_limit_env: MAX_LLM_CALLS
  output_token_limit_env: MAX_OUTPUT_TOKENS
