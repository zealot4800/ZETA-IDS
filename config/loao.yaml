seed: 17
split: {train: 0.70, validation: 0.15, test: 0.15}
partition_buckets: 10000
source_validation:
  certification_salt: 104729
  conditional_certification_salt: 65537
  conditional_proxy_salt: 131071
  conditional_proxy_train_fraction: 0.80
diagnostics:
  top_deviation_features: 5
tree: {max_depth: 6, max_leaf_nodes: 32, min_samples_leaf: 100}
regions: {benign_quantile: 0.95, distance_cap: 10.0, min_train_benign: 30}
safe_regions:
  quantiles: [0.50, 0.70, 0.85, 0.95]
  top_features: 4
  known_attack_leakage_budget: 0.001
  certification_fraction: 0.50
  max_training_attack_overlap: 0
membership:
  prototypes_per_region: 256
  neighbours: 3
  radius_quantiles: [0.50, 0.70, 0.85, 0.95]
  min_benign_retention: 0.70
  min_proxy_support: 30
conditional:
  cut_quantiles: [0.05, 0.50, 0.95]
  min_feature_entropy: 0.50
  min_joint_information: 0.15
  max_pair_features: 16
  min_source_region_support: 100
  min_tuning_cell_support: 10
  max_subregions_per_region: 8
  min_train_cell_support_candidates: [60, 120, 240]
  min_benign_retention: 0.80
  min_proxy_support: 30
calibration:
  min_validation_support: 30
  confidence: 0.95
  max_attack_leaf_benign_share: 0.10
  max_benign_region_attack_share: 0.10
benign_acceptance:
  max_fraction: 0.05
expected_attacks:
  cicids2018: [DDoS, DoS Hulk, DoS GoldenEye, DoS Slow, Brute Force, Port Scanning, Infiltration, Botnet, Web Attack]
  ton_iot: [backdoor, ddos, dos, injection, mitm, password, ransomware, scanning, xss]
  unsw_nb15: [Analysis, Backdoor, DoS, Exploits, Fuzzers, Generic, Reconnaissance, Shellcode, Worms]
  kdd: [DoS, Probe, R2L, U2R]
datasets:
  cicids2018:
    path: data/CICIDS2018.pkl
    family_column: mapped_label
    class_id_column: mapped_class_id
    binary_column: binary_label
    benign_value: BENIGN
    feature_source: metadata
    exclude: []
    categorical: []
  unsw_nb15:
    path: data/UNSW_NB15.pkl
    official_split:
      id_column: id
      reset_index: 175341
      start_id: 1
      train_fraction: 0.82
      description: UNSW id-reset train/test; group-disjoint train/validation
    family_column: attack_cat
    binary_column: label
    benign_value: Normal
    feature_source: columns
    exclude: [id]
    categorical: [proto, service, state]
  ton_iot:
    path: data/TON-IOT.pkl
    family_column: type
    binary_column: label
    benign_value: normal
    feature_source: columns
    exclude: [ts, src_ip, dst_ip, dns_query, ssl_subject, ssl_issuer,
              http_uri, http_referrer, http_user_agent, http_orig_mime_types,
              http_resp_mime_types, weird_addl]
    categorical: [proto, service, conn_state, dns_AA, dns_RD, dns_RA,
                  dns_rejected, ssl_version, ssl_cipher, ssl_resumed,
                  ssl_established, http_method, http_version, weird_name,
                  weird_notice]
  kdd:
    path: data/KDD.pkl
    row_selection:
      column: split
      include: train
      expected_values: [train, test]
      expected_included_rows: 125973
      expected_excluded_rows: 22544
      description: KDD train rows with detailed attack labels
    family_column: original_label
    binary_column: label
    benign_value: normal
    feature_source: metadata
    exclude: [difficulty, split]
    categorical: [protocol_type, service, flag]
    # Original KDD attack taxonomy: https://kdd.ics.uci.edu/databases/kddcup99/training_attack_types
    family_map:
      normal: normal
      back: DoS
      land: DoS
      neptune: DoS
      pod: DoS
      smurf: DoS
      teardrop: DoS
      ipsweep: Probe
      nmap: Probe
      portsweep: Probe
      satan: Probe
      ftp_write: R2L
      guess_passwd: R2L
      imap: R2L
      multihop: R2L
      phf: R2L
      spy: R2L
      warezclient: R2L
      warezmaster: R2L
      buffer_overflow: U2R
      loadmodule: U2R
      perl: U2R
      rootkit: U2R

paper:
  seed: 42
  reference:
    doi: https://doi.org/10.1109/TNSM.2026.3731401
    author_code: https://github.com/hussein-fawaz/ZDA-SHAP-UQ
    author_commit: 88fa3c196a62f4621cb2f3081fa4fc4dc9979631
    reproduction_status: adapted_reproduction
    deviations:
      - Existing PKL datasets and group-disjoint partitions replace the paper datasets and random row splits; one configured seed is used per invocation.
      - Missing values are imputed and duplicate rows retained to preserve shared flow identities; categorical columns use the existing training-fitted one-hot encoder.
      - Preprocessing is fitted on known-attack training rows only; the author code filters features before splitting. Input standardization follows the paper text.
      - The published 16-unit bottleneck and dropout at each hidden layer take precedence over the author code's 8-unit bottleneck and selective dropout.
      - The autoencoder uses a group-disjoint 80/20 subset of source training for early stopping; the author code reuses the outer source validation set.
      - SHAP StandardScaler and validation-fitted 2D StandardScaler, GMM BIC selection and density threshold follow the author code; tanh outputs do not imply clipped SHAP inputs.
      - Nonconverged GMM candidates are rejected; the author selector does not check convergence. Positive-class F1 replaces the paper's macro F1 for the requested comparison.
      - Hardware limits and batching are engineering settings, not reported paper hyperparameters. Array memory guards are not a process RSS cap.
  classifier:
    backend: rf  # rf or xgboost; both are backends of the same paper method.
    rf: {n_estimators: 400, criterion: gini, max_depth: null, min_samples_split: 2, min_samples_leaf: 1, max_features: sqrt, bootstrap: true}
    xgboost: {n_estimators: 100, max_depth: 6, learning_rate: 0.3, subsample: 1.0, colsample_bytree: 1.0, reg_lambda: 1.0, objective: 'multi:softprob', eval_metric: mlogloss, tree_method: hist}
  preprocessing:
    variance_threshold: 0.025  # Author code; paper describes zero-variance filtering.
    skew_threshold: 50.0
    winsor_limits: [0.05, 0.05]
    correlation_threshold: 0.93
    standardize: true
  shap:
    importance_fraction: 0.90
    feature_perturbation: tree_path_dependent
    model_output: raw
    approximate: {rf: true, xgboost: false}  # Matches author implementation.
    check_additivity: false
    selection_max_rows: null  # null uses every known-attack training row.
  reconstruction:
    encoder_units: [256, 128, 64, 32, 16]
    decoder_units: [16, 32, 64, 128, 256]
    activation: relu
    output_activation: tanh
    dropout: 0.10
    batch_norm_momentum: 0.99
    batch_norm_epsilon: 0.001
    kernel_initializer: glorot_uniform
    optimizer: {learning_rate: 0.001, beta_1: 0.9, beta_2: 0.999, epsilon: 0.0000001}
    loss: mse
    batch_size: 512
    max_epochs: 10
    patience: 3
    min_delta: 0.0
    train_fraction: 0.80
    split_salt: 32452843
    shuffle: true
  uncertainty:
    subensembles: 20
  gmm:
    components: [1, 2, 3, 4, 5, 6]
    covariance_types: [full, diag, tied, spherical]
    reg_covar: 0.000001
    n_init: 3
    max_iter: 100
    tol: 0.001
    init_params: kmeans
  threshold:
    quantile: 0.95
    quantile_method: linear
  resources:
    cpu_threads: 2
    tensorflow_inter_threads: 1
    tensorflow_log_level: '2'
    max_dense_mb: 512
    dtype: float32
    batch_size: 512

comparison:
  methods: [zeta, paper]
  datasets: [cicids2018, unsw_nb15, ton_iot, kdd]
  attacks: {}  # Optional dataset -> list of held-out families; empty means all.
  train_row_limit: null
  validation_row_limit: null
  test_row_limit: null
  sampling_seed: 17
  output_directory: results/comparison
  save_results: true
  print_table: true
  measure_memory: true
  metric_zero_division: 0
  percentage_decimals: 2
  filenames:
    metrics: metrics.csv
    summary: summary.json
    predictions: predictions.csv
    metadata: experiment_metadata.json
