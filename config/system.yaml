dataset: cic2017
datasets:
  cic2017:
    source_year: '2017'
    flows: data/CIC-IDS-2017/CIC-IDS-2017.pkl
    review_source: data/subsets/CIC-IDS-2017-10pct-v2.pkl
    model: artifacts/phase31-2017-family-partition-v1.joblib
    policy: artifacts/phase7-2017-risk-resource-v2.joblib
    reference: artifacts/phase8-2017-source-reference-v1.joblib
    memory: state/2017.yaml
  cic2018:
    source_year: '2018'
    flows: data/CIC-IDS-2018/CIC-IDS-2018.pkl
    review_source: data/subsets/CIC-IDS-2018-10pct-v2.pkl
    model: artifacts/phase31-2018-family-partition-v1.joblib
    policy: artifacts/phase7-2018-risk-resource-v2.joblib
    reference: artifacts/phase8-2018-source-reference-v1.joblib
    memory: state/2018.yaml
sampling:
  ratio: 0.1
  seed: 113
source_partitions:
  mode: frozen_source_only
  review_partitions:
  - training
  - calibration
  partition_seed: 17
features:
  compact_schema_version: zeta-flow-compact-v1
  full_schema_version: zeta-flow-pandas-v1
  metadata_columns:
  - sample_id
  - source_file
  - source_row
  - capture
  - flow_id
  - source_ip
  - destination_ip
  - timestamp
  - label_original
  - label_normalized
  dtype: float64
  columns:
  - name: flow_duration_us
    unit: microseconds
    cic2017: cic17__flow_duration
    cic2018: cic18__flow_duration
  - name: fwd_packet_count
    unit: count
    cic2017: cic17__total_fwd_packets
    cic2018: cic18__tot_fwd_pkts
  - name: bwd_packet_count
    unit: count
    cic2017: cic17__total_backward_packets
    cic2018: cic18__tot_bwd_pkts
  - name: fwd_bytes_total
    unit: bytes
    cic2017: cic17__total_length_of_fwd_packets
    cic2018: cic18__totlen_fwd_pkts
  - name: bwd_bytes_total
    unit: bytes
    cic2017: cic17__total_length_of_bwd_packets
    cic2018: cic18__totlen_bwd_pkts
  - name: fwd_packet_length_max_bytes
    unit: bytes
    cic2017: cic17__fwd_packet_length_max
    cic2018: cic18__fwd_pkt_len_max
  - name: fwd_packet_length_min_bytes
    unit: bytes
    cic2017: cic17__fwd_packet_length_min
    cic2018: cic18__fwd_pkt_len_min
  - name: fwd_packet_length_mean_bytes
    unit: bytes
    cic2017: cic17__fwd_packet_length_mean
    cic2018: cic18__fwd_pkt_len_mean
  - name: fwd_packet_length_std_bytes
    unit: bytes
    cic2017: cic17__fwd_packet_length_std
    cic2018: cic18__fwd_pkt_len_std
  - name: bwd_packet_length_max_bytes
    unit: bytes
    cic2017: cic17__bwd_packet_length_max
    cic2018: cic18__bwd_pkt_len_max
  - name: bwd_packet_length_min_bytes
    unit: bytes
    cic2017: cic17__bwd_packet_length_min
    cic2018: cic18__bwd_pkt_len_min
  - name: bwd_packet_length_mean_bytes
    unit: bytes
    cic2017: cic17__bwd_packet_length_mean
    cic2018: cic18__bwd_pkt_len_mean
  - name: bwd_packet_length_std_bytes
    unit: bytes
    cic2017: cic17__bwd_packet_length_std
    cic2018: cic18__bwd_pkt_len_std
  - name: flow_iat_mean_us
    unit: microseconds
    cic2017: cic17__flow_iat_mean
    cic2018: cic18__flow_iat_mean
  - name: flow_iat_std_us
    unit: microseconds
    cic2017: cic17__flow_iat_std
    cic2018: cic18__flow_iat_std
  - name: flow_iat_max_us
    unit: microseconds
    cic2017: cic17__flow_iat_max
    cic2018: cic18__flow_iat_max
  - name: flow_iat_min_us
    unit: microseconds
    cic2017: cic17__flow_iat_min
    cic2018: cic18__flow_iat_min
  - name: tcp_fin_flag_count
    unit: count
    cic2017: cic17__fin_flag_count
    cic2018: cic18__fin_flag_cnt
  - name: tcp_syn_flag_count
    unit: count
    cic2017: cic17__syn_flag_count
    cic2018: cic18__syn_flag_cnt
  - name: tcp_rst_flag_count
    unit: count
    cic2017: cic17__rst_flag_count
    cic2018: cic18__rst_flag_cnt
  preprocessing:
    quantizer_bins: 8
    missing_policy: nonfinite rows unresolved
    model_input_dtype: float32
frozen:
  model_version: zeta-phase3-family-partition-v1
  policy_version: zeta-phase7-risk-resource-v2
  reference_version: zeta-phase8-source-references-v1
  reference_template_rows: 1024
detector:
  evidence_chunk_rows: 200000
  policy_constraints:
    max_attack_leakage: 0.001
    max_false_malicious_alerts: 0.001
    desired_benign_acceptance: 0.5
    max_unresolved_rate: 0.8
    rule_memory_bytes: 4096
patterns:
  feature_names:
  - flow_duration_us
  - fwd_packet_count
  - bwd_packet_count
  - fwd_bytes_total
  - bwd_bytes_total
  - flow_iat_mean_us
memory:
  verification_delay_windows: 1
  verification_cost_usd: 0.02
  max_verification_cost_usd: 0.2
  min_independent_verifications: 2
  memory_ttl_windows: 5
  memory_max_entries: 1000
simulation:
  window_rows: 10000
  start_window: 0
  max_windows: null
output:
  reviews_path: null
  memory_input_path: null
